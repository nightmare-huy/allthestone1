name: fetch-mods

# This machine has no access to cdn.modrinth.com / forgecdn / maven / release-assets,
# so the jars are downloaded here (a runner with normal internet) and published as
# release assets of this repository. After that, anyone can build the instance with
#     python3 download_mods.py --from-release
# even from behind a filtering proxy, because api.github.com is reachable everywhere.
on:
  push:
    branches-ignore: [mods-store]   # the jar store branch must not re-trigger itself
    paths:
      - "modlist.json"
      - "download_mods.py"
      - ".github/workflows/fetch-mods.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"   # every Monday, pick up new builds

permissions:
  contents: write

concurrency:
  group: fetch-mods
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download every jar (Modrinth -> CurseForge -> Maven -> GitHub)
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: python3 download_mods.py 2>&1 | tee download-log.txt

      - name: Report
        run: |
          echo "===== download log =====" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat download-log.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "### jars in mods/" >> "$GITHUB_STEP_SUMMARY"
          ls -la mods/*.jar 2>/dev/null | wc -l >> "$GITHUB_STEP_SUMMARY" || true
          if [ -f MISSING_MODS.md ]; then
            cat MISSING_MODS.md >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "files: $(ls mods/*.jar 2>/dev/null | wc -l)"

      - name: Verify the jars are real archives (not HTML error pages)
        run: |
          set -e
          bad=0
          for f in mods/*.jar; do
            [ -e "$f" ] || continue
            if ! python3 -c "import zipfile,sys;zipfile.ZipFile(sys.argv[1]).testzip()" "$f"; then
              echo "not a valid jar: $f"; bad=$((bad+1)); rm -f "$f"
            fi
          done
          echo "invalid jars removed: $bad"

      - name: Build the importable .mrpack
        run: |
          mkdir -p dist
          python3 download_mods.py --mrpack dist/allthestone1-1.0.0.mrpack || true
          ls -la dist

      - name: Publish everything to the mods-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release delete mods-latest --yes --cleanup-tag || true
          {
            echo "Automatic build for Minecraft 1.21.1 / NeoForge ($(date -u +%Y-%m-%d))."
            echo
            echo "## Resolution log"
            echo '```'
            grep -vE '^\s*$' download-log.txt | tail -80 || true
            echo '```'
          } > release-notes.md
          notes="$(cat release-notes.md)"
          gh release create mods-latest \
            --title "Mods (1.21.1 / NeoForge, $(date -u +%Y-%m-%d))" \
            --notes "$notes" \
            mods/*.jar dist/*.mrpack MISSING_MODS.md download-log.txt || true
          gh release view mods-latest --json assets --jq '.assets[].name' | sort

  # Keeps a git-only copy of the jars. Handy for machines whose outbound filter allows
  # github.com (git protocol) but not the release CDNs:
  #     git fetch origin mods-store && git archive FETCH_HEAD mods | tar -x
  store-branch:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Re-create the download in this job
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: python3 download_mods.py 2>&1 | tail -5
      - name: Commit the jars to the mods-store branch
        run: |
          set -e
          size=$(du -sm mods | cut -f1)
          echo "mods/: ${size} MiB"
          if [ "$size" -gt 95 ]; then echo "too big for a git branch, skipping"; exit 0; fi
          git config user.name  "allthestone1-bot"
          git config user.email "bot@users.noreply.github.com"
          mkdir -p /tmp/jars && cp mods/*.jar /tmp/jars/
          git checkout --orphan mods-store
          git rm -rf --cached . >/dev/null
          rm -rf ./* .github .gitignore 2>/dev/null || true
          mkdir -p mods
          cp /tmp/jars/*.jar mods/
          cat > README.md <<'EOF'
          # allthestone1 - mod jar store

          Do not edit by hand. This branch only exists so the jars can be fetched over the
          git protocol on networks where the mod CDNs are filtered:

              git fetch origin mods-store
              git archive FETCH_HEAD mods | tar -x

          The pack itself lives on the default branch.
          EOF
          git add -A -f
          git commit -q -m "mods: 1.21.1 / NeoForge jar set ($(date -u +%Y-%m-%d))"
          git push -f origin mods-store
